# Alternative zu Caddy, falls auf dem VPS schon nginx läuft.
# crash.example.org durch die eigene Subdomain ersetzen.
# Zertifikat z. B. mit: certbot --nginx -d crash.example.org
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crash.example.org;
    # ssl_certificate / ssl_certificate_key trägt certbot ein

    client_max_body_size 256k;

    location = /api/v1/reports { proxy_pass http://127.0.0.1:8765; include proxy_params; }
    location = /healthz        { proxy_pass http://127.0.0.1:8765; include proxy_params; }
    location / { return 404; }
}
