[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-presenter"
version = "0.2.0"
description = "PDF-Präsentationen mit Presenteransicht auf zwei Bildschirmen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # PySide6 6.12.0 zählt unter Python < 3.12 die Referenzen auf None/True/False
    # falsch. Nach einigen hundert Aktionen bricht der Interpreter dann mit
    # „Fatal Python error: deallocating None“ ab. Ab Python 3.12 sind diese
    # Objekte unsterblich und der Fehler bleibt folgenlos.
    "PySide6>=6.6,<6.12; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
pdf-presenter = "pdf_presenter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
